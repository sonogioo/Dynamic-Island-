name: Release del fork

# Avvio a mano: Actions → "Release del fork" → Run workflow, sul branch fix/oneui-notifiche-whatsapp,
# con il tag della nuova versione (es. v1.6.5-fix5). Le note sono in .github/release-notes.md.
# La chiave di firma è sempre la stessa: sta solo nel segreto DYNAMICISLAND_KEY (non nel repository),
# così ogni versione si installa sopra la precedente senza perdere le impostazioni.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. v1.6.5-fix5)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Controlli
        env:
          KS_B64: ${{ secrets.DYNAMICISLAND_KEY }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.\-]+$ ]]; then echo "::error::Tag non valido: $TAG"; exit 1; fi
          if [[ -z "$KS_B64" ]]; then echo "::error::Manca il segreto DYNAMICISLAND_KEY"; exit 1; fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::La release $TAG esiste già"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilazione
        run: ./gradlew --no-daemon assembleRelease

      # La chiave esiste solo durante questo passaggio e poi viene cancellata
      - name: Firma
        env:
          KS_B64: ${{ secrets.DYNAMICISLAND_KEY }}
        run: |
          ks="$RUNNER_TEMP/fork.p12"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KS_B64" | base64 -d > "$ks"
          export KS_PASS=dynamic-island-fork
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          apk="out/DynamicIsland-${TAG#v}.apk"
          "$bt/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias island \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --print-certs "$apk"

      - name: Release
        run: |
          gh release create "$TAG" out/*.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dynamic Island ${TAG#v}" --notes-file .github/release-notes.md --latest
